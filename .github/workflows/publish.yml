name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to publish to"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
      confirm_publish:
        description: "Set to true to allow publishing"
        required: true
        default: false
        type: boolean

jobs:
  verify-release-ref:
    name: Verify exact main release ref
    if: inputs.confirm_publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verified_sha: ${{ steps.verify.outputs.verified_sha }}

    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify dispatch is the current main commit
        id: verify
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::Publishing is allowed only from refs/heads/main (got $DISPATCH_REF)"
            exit 1
          fi

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$CHECKED_OUT_SHA" != "$DISPATCH_SHA" ] || [ "$CURRENT_MAIN_SHA" != "$DISPATCH_SHA" ]; then
            echo "::error::Dispatch SHA, checkout SHA, and current main SHA must match exactly"
            echo "dispatch=$DISPATCH_SHA checkout=$CHECKED_OUT_SHA current_main=$CURRENT_MAIN_SHA"
            exit 1
          fi

          echo "verified_sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify-release-ref
    runs-on: ubuntu-latest
    if: inputs.confirm_publish == true && needs.verify-release-ref.result == 'success'
    environment: ${{ inputs.environment || 'testpypi' }}
    outputs:
      package_version: ${{ steps.package_version.outputs.package_version }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release-ref.outputs.verified_sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        run: |
          python -m pip install --only-binary :all: pip==26.2.1
          python -m pip install --only-binary :all: -r requirements-dev.txt
          python -m pip install --only-binary :all: build==1.5.0 twine==7.0.0

      - name: Read package version
        id: package_version
        run: |
          VERSION=$(python - <<'PY'
          from pathlib import Path
          import re

          text = Path("traigent_schema/version.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              raise SystemExit("Unable to determine package version")
          print(match.group(1))
          PY
          )
          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.package_version }}
        run: |
          VERSION_FILE="$PACKAGE_VERSION"
          VERSION_IMPORT=$(python -c "import traigent_schema; print(traigent_schema.__version__)")
          echo "version.py: $VERSION_FILE"
          echo "package import: $VERSION_IMPORT"
          if [ "$VERSION_FILE" != "$VERSION_IMPORT" ]; then
            echo "Error: Version mismatch between version.py and package import"
            exit 1
          fi

      - name: Run tests before publishing
        run: |
          pytest tests/ -v --tb=short

      - name: Build package
        run: |
          python -m build

      - name: Check package with twine
        run: |
          twine check dist/*

      - name: Test installation from built package
        run: |
          python -m venv test_env
          source test_env/bin/activate
          python -m pip install --only-binary :all: pip==26.2.1
          python -m pip install --only-binary :all: -r requirements-dev.txt

          mapfile -t WHEELS < <(find dist -maxdepth 1 -type f -name '*.whl' -print)
          if [ "${#WHEELS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one built wheel, found ${#WHEELS[@]}"
            exit 1
          fi
          WHEEL_PATH="${WHEELS[0]}"
          WHEEL_HASH=$(python - "$WHEEL_PATH" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )
          printf 'traigent-schema==%s --hash=sha256:%s\n' \
            '${{ steps.package_version.outputs.package_version }}' "$WHEEL_HASH" \
            > "$RUNNER_TEMP/built-wheel-requirements.txt"
          python -m pip install --no-index --find-links "$PWD/dist" --no-deps \
            --only-binary :all: --require-hashes \
            -r "$RUNNER_TEMP/built-wheel-requirements.txt"

          cd "$RUNNER_TEMP"
          python - <<'PY'
          import traigent_schema
          from traigent_schema import SchemaValidator, load_schema

          print(f"traigent-schema v{traigent_schema.__version__} imported successfully")
          print(f"Available schemas: {len(SchemaValidator().available_schemas)}")
          print(load_schema("experiment_schema")["$schema"])
          PY

      - name: Re-verify main has not moved before publishing
        env:
          VERIFIED_SHA: ${{ needs.verify-release-ref.outputs.verified_sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$CHECKED_OUT_SHA" != "$VERIFIED_SHA" ] || [ "$CURRENT_MAIN_SHA" != "$VERIFIED_SHA" ]; then
            echo "::error::Verified release SHA is no longer the exact current main commit"
            echo "verified=$VERIFIED_SHA checkout=$CHECKED_OUT_SHA current_main=$CURRENT_MAIN_SHA"
            exit 1
          fi

      - name: Publish to Test PyPI
        if: inputs.environment == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

      - name: Publish to PyPI
        if: inputs.environment == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          verbose: true

      - name: Create deployment summary
        if: always()
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.package_version }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Deployment Summary"
            echo "- **Package**: traigent-schema"
            echo "- **Version**: $PACKAGE_VERSION"
            echo "- **Environment**: $INPUT_ENVIRONMENT"
            echo "- **Status**: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-publication:
    needs: [verify-release-ref, publish]
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.verify-release-ref.result == 'success' &&
      needs.publish.result == 'success'
    permissions:
      contents: read

    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify checkout matches the approved dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "$DISPATCH_REF" != "refs/heads/main" ] || [ "$CHECKED_OUT_SHA" != "$DISPATCH_SHA" ]; then
            echo "::error::Publication verification must use the exact approved main dispatch"
            echo "dispatch_ref=$DISPATCH_REF dispatch_sha=$DISPATCH_SHA checkout=$CHECKED_OUT_SHA"
            exit 1
          fi

      - name: Wait for package propagation
        run: sleep 60

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Test installation from package index
        env:
          EXPECTED_VERSION: ${{ needs.publish.outputs.package_version }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$INPUT_ENVIRONMENT" = "testpypi" ]; then
            PACKAGE_LABEL="TestPyPI"
            PACKAGE_API_URL="https://test.pypi.org/pypi/traigent-schema/json"
          else
            PACKAGE_LABEL="PyPI"
            PACKAGE_API_URL="https://pypi.org/pypi/traigent-schema/json"
          fi

          VERSION="$EXPECTED_VERSION"
          echo "Testing installation of traigent-schema==$VERSION from $PACKAGE_LABEL"

          PACKAGE_JSON="$RUNNER_TEMP/package.json"
          LOCKED_REQUIREMENT="$RUNNER_TEMP/published-package-requirements.txt"
          curl --proto '=https' --proto-redir '=https' -fsSL "$PACKAGE_API_URL" -o "$PACKAGE_JSON"
          python - "$VERSION" "$PACKAGE_JSON" "$LOCKED_REQUIREMENT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          path = sys.argv[2]
          requirement_path = Path(sys.argv[3])
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)
          releases = data.get("releases", {})
          artifacts = releases.get(version, [])
          wheels = [
              artifact
              for artifact in artifacts
              if artifact.get("packagetype") == "bdist_wheel"
              and artifact.get("filename", "").endswith("py3-none-any.whl")
          ]
          if len(wheels) != 1:
              raise SystemExit(
                  f"Expected one universal wheel for {version}, found {len(wheels)}"
              )
          artifact = wheels[0]
          url = artifact.get("url", "")
          digest = artifact.get("digests", {}).get("sha256", "")
          if not url.startswith("https://"):
              raise SystemExit("Package artifact URL must use HTTPS")
          if not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("Package artifact is missing a valid SHA-256 digest")
          requirement_path.write_text(
              f"traigent-schema @ {url} --hash=sha256:{digest}\n",
              encoding="utf-8",
          )
          print(f"Locked version {version} to {artifact['filename']} ({digest[:12]}...)")
          PY

          python -m pip install --only-binary :all: uv==0.12.4
          uv sync --frozen --no-dev --no-build --no-install-project
          VERIFY_PYTHON="$PWD/.venv/bin/python"
          uv pip install --python "$VERIFY_PYTHON" --no-deps --no-build \
            --require-hashes -r "$LOCKED_REQUIREMENT"

          cd "$RUNNER_TEMP"
          "$VERIFY_PYTHON" - <<'PY'
          import traigent_schema
          from traigent_schema import SchemaValidator, load_schema

          print(f"Installed traigent-schema v{traigent_schema.__version__}")
          print(f"Available schemas: {len(SchemaValidator().available_schemas)}")
          print(load_schema("experiment_schema")["$schema"])
          PY

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Package successfully published and verified." >> "$GITHUB_STEP_SUMMARY"
          echo "Users can now install with: \`pip install traigent-schema\`" >> "$GITHUB_STEP_SUMMARY"
