name: Dispatch G8 Validation

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch validation-spine G8
    runs-on: ubuntu-latest
    steps:
      # TraigentSchema is a PUBLIC repo, so org-level secrets with
      # visibility:private (SPINE_RO_TOKEN / VALIDATION_CI_PAT) are invisible
      # to it, and a personal-access-token repo secret is subject to org SAML
      # SSO enforcement (PATs lose their per-org SSO grant on every SAML
      # policy change). An App installation token is minted fresh on every
      # run, belongs to no person, and is not SSO-revocable. See
      # tools/secret-ops/README-ci-github-app.md.
      - name: Mint spine-dispatch app token
        id: spine_app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SPINE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SPINE_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Dispatch validation-spine repository_dispatch
        env:
          GH_TOKEN: ${{ steps.spine_app_token.outputs.token }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BASE_BRANCH: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
        run: |
          set -euo pipefail

          # A skip is a LEGITIMATE outcome (non-PR upstream event, or a
          # failed/non-success upstream run) but it must never look like a
          # pass. `::notice::` alone renders identically to a normal green
          # check in the Actions UI/API, so a run that skipped and a run that
          # actually dispatched were indistinguishable at a glance — the
          # exact "quietly skipped reads as validated" false-green this
          # workflow otherwise guards against below. Escalate to `::warning::`
          # (visibly flagged on the run) and also write a
          # $GITHUB_STEP_SUMMARY line, since notices/warnings don't appear in
          # the checks list the way the step summary does.
          skip_summary() {
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### G8 dispatch: SKIPPED"
                echo ""
                echo "$1"
                echo ""
                echo "No repository_dispatch was sent to traigent-validation-spine."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_EVENT" != "pull_request" ]; then
            msg="Skipping G8 dispatch for non-PR upstream event: $WORKFLOW_EVENT"
            echo "::warning::${msg}"
            skip_summary "$msg"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_CONCLUSION" != "success" ]; then
            msg="Skipping G8 dispatch because upstream workflow concluded: $WORKFLOW_CONCLUSION"
            echo "::warning::${msg}"
            skip_summary "$msg"
            exit 0
          fi
          # Credential presence is a HARD requirement past this point. The two
          # skips above are legitimate untrusted/irrelevant contexts; a missing
          # token is operator misconfiguration. A quietly-skipped dispatch reads
          # as "the spine validated this" when nothing was ever sent — an unsafe
          # false-green. This mirrors the hardening already in
          # traigent-model-checking's copy of this workflow.
          if [ -z "${GH_TOKEN:-}" ]; then
            msg="spine-dispatch App token is empty; cannot dispatch validation-spine G8. Check that SPINE_DISPATCH_APP_ID / SPINE_DISPATCH_APP_PRIVATE_KEY are configured and the App is installed on this repo and on traigent-validation-spine, or the spine will never see this change."
            echo "::error::${msg}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### G8 dispatch: FAILED"
                echo ""
                echo "$msg"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          source_sha="${SOURCE_HEAD_SHA:-$GITHUB_SHA}"
          source_branch="${SOURCE_HEAD_BRANCH:-$GITHUB_REF_NAME}"
          source_base_branch="${SOURCE_BASE_BRANCH:-}"
          source_run_id="${SOURCE_RUN_ID:-}"
          source_workflow="${SOURCE_WORKFLOW:-}"

          # The payload must carry the exact commit, never a branch name that
          # can move under the spine between dispatch and validation.
          if ! printf '%s' "$source_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Refusing to dispatch without a full 40-char source SHA (got '$source_sha')."
            exit 1
          fi

          echo "Dispatching validation-g8 for $SOURCE_REPO@$source_sha (base ${source_base_branch:-<none>})."

          gh api --method POST repos/Traigent/traigent-validation-spine/dispatches \
            -f event_type=validation-g8 \
            -f client_payload[source_repo]="$SOURCE_REPO" \
            -f client_payload[source_workflow]="$source_workflow" \
            -f client_payload[source_run_id]="$source_run_id" \
            -f client_payload[source_head_branch]="$source_branch" \
            -f client_payload[source_base_branch]="$source_base_branch" \
            -f client_payload[source_head_sha]="$source_sha"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### G8 dispatch: SENT"
              echo ""
              echo "Dispatched validation-g8 for $SOURCE_REPO@$source_sha."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
