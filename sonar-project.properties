# SonarCloud Automatic Analysis (AutoScan) reads this file.
# Keep this file limited to AutoScan-supported scope settings.
# If this repo moves to CI-based analysis like traigent-js, restore CI/scanner
# keys such as host URL, project identity, branch setup, Python version, and
# coverage report paths in the workflow environment instead.

# Sources and tests
sonar.sources=traigent_schema
sonar.tests=tests

# Structural exclusions - defensive even though sonar.sources is narrow.
# parity/ is a cross-SDK parity manifest, not first-party source.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**,**/build/**,**/dist/**,**/node_modules/**,**/coverage/**,**/.pytest_cache/**,**/.mypy_cache/**,**/.ruff_cache/**,**/migrations/**,**/vendor/**,**/__generated__/**,**/*.generated.*,**/*.egg-info/**,**/poetry.lock,**/uv.lock,parity/**

# Copy-paste detection scope ONLY. This is deliberately NOT added to
# sonar.exclusions above: tests/data/** stays fully analysed for bugs, code
# smells, and security findings. Only duplication detection is disabled there.
#
# Rationale: tests/data/** holds declarative JSON fixture corpora, not code.
# Structural repetition across cases is the point of a corpus - each case must
# be shaped the same way for the cases to be comparable and for a reviewer to
# audit them side by side. Compressing a corpus to satisfy a duplication metric
# makes it harder to read and harder to verify, which is the opposite of what
# the metric exists to encourage. The metric is measuring the wrong thing here.
#
# Same reasoning already applied to parity/** on the line above ("a cross-SDK
# parity manifest, not first-party source").
#
# This narrows one metric's scope; it does NOT move a threshold. The 3%
# new-code duplication limit is unchanged and still applies in full to every
# line of Python under traigent_schema/ and tests/.
sonar.cpd.exclusions=tests/data/**
