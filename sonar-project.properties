# SonarCloud Automatic Analysis (AutoScan) reads this file.
# Keep this file limited to AutoScan-supported scope settings.
# If this repo moves to CI-based analysis like traigent-js, restore CI/scanner
# keys such as host URL, project identity, branch setup, Python version, and
# coverage report paths in the workflow environment instead.

# Sources and tests
sonar.sources=traigent_schema
sonar.tests=tests

# Structural exclusions - defensive even though sonar.sources is narrow.
# parity/ is a cross-SDK parity manifest, not first-party source.
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**,**/build/**,**/dist/**,**/node_modules/**,**/coverage/**,**/.pytest_cache/**,**/.mypy_cache/**,**/.ruff_cache/**,**/migrations/**,**/vendor/**,**/__generated__/**,**/*.generated.*,**/*.egg-info/**,**/poetry.lock,**/uv.lock,parity/**

# INERT under AutoScan - verified 2026-08-10. Do NOT rely on this key to scope
# duplication today: SonarCloud AutoScan does not honour sonar.cpd.exclusions
# (see the AutoScan-supported-scope warning at the top of this file). Confirmed
# by re-analysing a rebased head fresh with this line present on both the PR
# head and develop: new-code duplication stayed byte-identical at 3.5%. The
# tests/data/** duplication this was meant to exclude was actually fixed by
# restructuring the corpus itself (tests/data/fp2/agent_lifecycle_cases.json),
# not by this setting. Retained, unused, only in case this repo moves to
# CI-based analysis (see header), where sonar.cpd.exclusions would apply.
sonar.cpd.exclusions=tests/data/**
